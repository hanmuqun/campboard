name: ranking

# Popularity shifts slowly but it does shift: a park gets a new reservation
# system, a campground closes for repairs, a viral video sends everyone to one
# place. Weekly is enough to keep the board honest, and it costs nothing.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rebuild the popularity ranking
        run: python discover.py --top 40

      - name: Commit if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ranking.json; then
            echo "ranking unchanged"
            exit 0
          fi
          git config user.name "campboard-bot"
          git config user.email "campboard-bot@users.noreply.github.com"
          git add data/ranking.json
          git commit -m "chore: refresh the campground popularity ranking"
          git push
